[package]
name = "ks-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Kestrel preview engine: text, Markdown, images, archives and hex"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tiff"] }
lru = "0.18.5"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
thiserror.workspace = true
tokio-util.workspace = true
tracing.workspace = true
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-width.workspace = true
unrar.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true
